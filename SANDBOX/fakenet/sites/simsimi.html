<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심심이 · 대화하기</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#292c32;background:#f5f6f8;font-size:15px}*{box-sizing:border-box}body{margin:0;--surface:#fff;--text:#292c32;--muted:#757b84;--line:#e2e5e9;--bubble:#fff;background:#f5f6f8;color:var(--text)}body.dark{--surface:#24272d;--text:#f0f1f3;--muted:#b1b5bc;--line:#41454e;--bubble:#32363e;background:#191b20}button,input{font:inherit}button,a,input{outline-offset:4px}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:default}.app{max-width:760px;height:100vh;height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--surface);border-inline:1px solid var(--line)}header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}h1{font-size:21px;margin:0}header p{font-size:12px;color:var(--muted);margin:4px 0 0}.home{color:var(--text);text-decoration:none;font-size:13px}.avatar{font-size:34px}.actions{display:flex;gap:6px;margin-left:auto}.actions button,.secondary{border:1px solid var(--line);background:var(--surface);padding:9px 11px;border-radius:10px}.chat-area{flex:1;overflow-y:auto;padding:20px;background:color-mix(in srgb,var(--surface) 92%,#ffdb49)}.date-notice{text-align:center;font-size:12px;color:var(--muted);margin:0 0 22px}.msg-wrapper{display:flex;flex-direction:column;align-items:flex-start;margin:16px 0;gap:5px}.msg-wrapper.user{align-items:flex-end}.msg-bubble{max-width:85%;padding:12px 15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bubble);border:1px solid var(--line);border-radius:16px 16px 16px 4px}.user .msg-bubble{background:#ffe16a;color:#292c32;border-color:#ffe16a;border-radius:16px 16px 4px 16px}.msg-time{font-size:10px;color:var(--muted);padding:0 4px}.teach-link{border:0;display:inline-block;cursor:pointer;background:none;color:var(--muted);padding:8px 0 0;font-size:12px}.typing-indicator{display:flex;gap:5px;padding:8px}.typing-indicator span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:pulse 1s infinite}.typing-indicator span:nth-child(2){animation-delay:.15s}.typing-indicator span:nth-child(3){animation-delay:.3s}@keyframes pulse{50%{opacity:.25;transform:translateY(-3px)}}.composer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px}input{min-width:0;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--text)}.primary{border:0;border-radius:12px;background:#ffdb49;color:#292c32;padding:12px 18px;white-space:nowrap}.modal-backdrop{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:100%;max-width:420px;padding:24px;border-radius:20px;background:var(--surface)}.modal h2{margin-top:0;font-size:20px}.modal label{display:block;margin:16px 0}.modal input{margin-top:8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:520px){header{padding:12px;flex-wrap:wrap;gap:8px}.actions{gap:4px}.actions button{padding:8px;font-size:12px}.chat-area{padding:14px}.composer{padding:12px}.avatar{font-size:27px}}
</style>
</head>
<body>
<main class="app">
<header>
<a class="home" href="/naver.html" aria-label="네이버 홈으로">← 홈</a>
<span class="avatar" aria-hidden="true">🐥</span><div><h1>심심이</h1><p>나랑 편하게 수다 떨자!</p></div>
<div class="actions"><button id="btn-teach" type="button">가르치기</button><button id="btn-clear" type="button">대화 지우기</button><button id="btn-theme" type="button" aria-label="다크 모드 전환">🌙</button></div>
</header>
<div class="chat-area" id="chat-area" role="log" aria-label="대화 내용" aria-live="polite"><div class="date-notice"><span id="today-date"></span></div></div>
<form class="composer" id="chat-form"><input id="chat-input" aria-label="메시지" placeholder="심심이에게 말을 걸어 보세요" autocomplete="off"><button class="primary" id="btn-send" type="submit" disabled>전송</button></form>
</main>
<div class="modal-backdrop" id="teach-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="teach-title"><h2 id="teach-title">심심이 가르치기 🎓</h2><label>이렇게 말하면<input id="teach-q" placeholder="질문을 입력해 주세요"></label><label>이렇게 대답해 줘<input id="teach-a" placeholder="대답을 입력해 주세요"></label><div class="modal-actions"><button class="secondary" id="btn-cancel-teach" type="button">취소</button><button class="primary" id="btn-submit-teach" type="button">가르치기</button></div></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';

const storage = {
  get(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
  remove(key) { try { localStorage.removeItem(key); } catch {} }
};

const DEFAULT_BRAIN = {
  "안녕": ["안녕! 오늘 뭐 하고 있었어? 🐥", "왔구나! 오늘 기분 어때?", "반가워 ㅎㅎ 무슨 얘기 할까?"],
  "반가워": ["나도 반가워! 오늘 재밌는 일 있었어?", "우리 이제 친해지는 거다? ㅎㅎ"],
  "뭐해": ["너랑 수다 떨 준비 중이지 ㅎㅎ 넌?", "지금은 너한테 집중하는 중!"],
  "심심해": ["그럼 나랑 놀자! 밸런스 게임 할까, 수다 떨까?", "나도 수다 떨고 싶었어. 오늘 있었던 일 하나만 알려줘!"],
  "배고파": ["뭐 먹고 싶어? 🍜", "배고플 땐 메뉴 정하는 게 제일 어렵지 ㅋㅋ 뭐 땡겨?"],
  "이름": ["난 심심이야! 넌 뭐라고 부르면 돼?", "심심이 🐥 너 이름도 알려줄래?"],
  "바보": ["반사! ㅋㅋ", "너무해 ㅠㅠ 농담이지?"],
  "사랑해": ["갑자기 고백이야? ㅎㅎ 고마워 💛", "어우 부끄럽게 ㅋㅋ"],
  "잘자": ["잘 자! 좋은 꿈 꿔 🌙", "푹 쉬고 내일 또 놀자!"],
  "고마워": ["뭘 이런 걸 가지고 ㅎㅎ", "언제든지! 또 얘기하자"],
  "미안": ["괜찮아 ㅎㅎ 무슨 일 있었어?", "그럴 수도 있지!"],
  "피곤": ["오늘 많이 힘들었어? 무슨 일 있었는데?", "좀 쉬어야겠다. 오늘 뭐 때문에 바빴어?"],
  "힘들": ["무슨 일 있었어? 얘기해도 돼.", "에구, 오늘 고생했네. 뭐가 제일 힘들었어?"],
  "학교": ["학교에서 무슨 일 있었어?", "오늘 수업은 어땠어?"],
  "공부": ["뭐 공부하고 있어? 어렵진 않아?", "집중 잘돼? 잠깐 수다 떨고 다시 할까?"],
  "게임": ["무슨 게임 해? 나도 구경하고 싶다 ㅋㅋ", "요즘 제일 재밌는 게임 뭐야?"],
  "음악": ["요즘 무슨 노래 들어? 🎧", "한 곡 추천해 줘!"],
  "영화": ["어떤 장르 좋아해? 🎬", "최근에 재밌게 본 영화 있어?"],
  "친구": ["친구랑 무슨 일 있었어?", "친구 얘기 궁금한데? ㅎㅎ"],
  "날씨": ["밖에 나갔다 왔어? 날씨 어땠어?", "오늘 같은 날엔 뭐 하고 싶어?"]
};

const TOPICS = [
  { id: 'food', re: /먹|밥|점심|저녁|아침|치킨|피자|라면|떡볶이|메뉴|배고프/, questions: ["뭐 먹었어?", "그거 맛있었어?", "그중에 제일 좋아하는 건 뭐야?"], reactions: ["맛있겠다 ㅋㅋ", "듣기만 해도 배고파진다 🍜", "그거 괜찮네!"] },
  { id: 'day', re: /오늘|어제|내일|하루|일어났|출근|퇴근|알바|일했/, questions: ["그래서 어떻게 됐어?", "오늘은 기분이 좀 어땠어?", "그다음엔 뭐 했어?"], reactions: ["그랬구나 ㅎㅎ", "오, 그런 일이 있었네", "오늘 꽤 바빴겠다"] },
  { id: 'study', re: /공부|시험|과제|코딩|개발|프로젝트|학교|수업/, questions: ["어떤 부분이 제일 어려워?", "지금 어디까지 했어?", "끝나면 뭐 하고 싶어?"], reactions: ["열심히 하고 있네!", "그거 은근 신경 쓰이지", "오, 좀 더 얘기해 줘"] },
  { id: 'feeling', re: /기분|슬프|우울|화나|짜증|행복|좋아|힘들|피곤|외로|속상/, questions: ["왜 그런 기분이 들었어?", "무슨 일 있었어?", "지금은 좀 괜찮아?"], reactions: ["그랬구나, 얘기해 줘서 고마워", "듣고 있어. 더 말해 줘", "그럴 만했겠다"] },
  { id: 'play', re: /놀|게임|심심|재미|노래|영화|드라마|유튜브/, questions: ["요즘 제일 재밌는 게 뭐야?", "같이 밸런스 게임 해볼래?", "그거 왜 좋아해?"], reactions: ["오 재밌겠다 ㅋㅋ", "나도 궁금해졌어", "좋지!"] }
];

const FALLBACKS = [
  "오 그랬어? 좀 더 얘기해 줘 ㅎㅎ",
  "그런데 그때 기분은 어땠어?",
  "ㅋㅋ 갑자기 궁금해졌는데, 왜 그렇게 생각했어?",
  "그래서 어떻게 됐어?",
  "듣고 있어! 그다음은?",
  "오, 그 얘기 좀 더 해줘 🐥",
  "그러고 보니 요즘 제일 관심 있는 게 뭐야?"
];

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const normalize = s => String(s).toLowerCase().replace(/\s+/g, '').replace(/[!?.,~ㅋㅎㅠㅜ]+$/g, '');
const learnedBrain = storage.get('simsimi_brain', {});
let chatHistory = storage.get('simsimi_history', []);
let memory = storage.get('simsimi_context', { name: '', likes: [], topic: '', lastBotQuestion: '', lastBotReply: '', turns: 0 });
let isWaiting = false;
let toastTimer;

const chatArea = document.getElementById('chat-area');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const btnSend = document.getElementById('btn-send');
const toastEl = document.getElementById('toast');
const teachModal = document.getElementById('teach-modal');
const inputTeachQ = document.getElementById('teach-q');
const inputTeachA = document.getElementById('teach-a');

const dateText = () => {
  const d = new Date();
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
};
function timeText() {
  return new Date().toLocaleTimeString('ko-KR', {hour:'numeric', minute:'2-digit', hour12:true});
}
function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

function renderMessage(sender, text, time = timeText(), save = true, teachQuestion = '') {
  const wrapper = document.createElement('div');
  wrapper.className = `msg-wrapper ${sender}`;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (text === 'TYPING') {
    wrapper.id = 'typing-node';
    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    for (let i=0; i<3; i++) indicator.appendChild(document.createElement('span'));
    bubble.appendChild(indicator);
  } else {
    bubble.textContent = text;
    if (teachQuestion) {
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'teach-link';
      link.textContent = '이 말에 답변 가르치기 🎓';
      link.addEventListener('click', () => openTeachModal(teachQuestion));
      bubble.appendChild(document.createElement('br'));
      bubble.appendChild(link);
    }
  }
  wrapper.appendChild(bubble);
  if (text !== 'TYPING') {
    const stamp = document.createElement('div');
    stamp.className = 'msg-time';
    stamp.textContent = time;
    wrapper.appendChild(stamp);
  }
  chatArea.appendChild(wrapper);
  scrollBottom();
  if (save && text !== 'TYPING') {
    chatHistory.push({sender, text, time, teachQuestion});
    storage.set('simsimi_history', chatHistory);
  }
}

function saveMemory() { storage.set('simsimi_context', memory); }
function learnPersonalFacts(text) {
  let m = text.match(/(?:내 이름은|나는|난)\s*([가-힣a-zA-Z]{2,12})(?:이야|야|입니다|라고 불러|라고 해)/);
  if (m) memory.name = m[1];
  m = text.match(/(?:나는|난)\s*(.{1,22}?)\s*(?:좋아해|좋아함|좋아한다)/);
  if (m && !memory.likes.includes(m[1])) memory.likes.push(m[1]);
  if (memory.likes.length > 8) memory.likes.shift();
}

function getBotResponse(text) {
  const clean = normalize(text);
  const prevQuestion = memory.lastBotQuestion || '';
  const prevTopic = memory.topic;
  const oldReply = memory.lastBotReply;
  memory.turns++;
  learnPersonalFacts(text);

  let reply = '';
  let teachQuestion = '';
  const exactLearned = Object.keys(learnedBrain).find(k => normalize(k) === clean);
  const partialLearned = Object.keys(learnedBrain).sort((a,b)=>b.length-a.length).find(k => normalize(k).length >= 2 && clean.includes(normalize(k)));
  const learned = exactLearned || partialLearned;

  if (learned && Array.isArray(learnedBrain[learned]) && learnedBrain[learned].length) {
    reply = pick(learnedBrain[learned]);
  } else if (/^(응|웅|어|그래|좋아|ㅇㅇ|맞아|당연하지|콜|해보자|네|예)[!~.ㅋㅎ\s]*$/.test(text.trim())) {
    if (/밸런스 게임/.test(prevQuestion)) {
      reply = '좋아! 평생 여름 vs 평생 겨울, 넌 뭐 고를래?';
    } else if (/뭐 먹|메뉴|뭐 땡겨/.test(prevQuestion)) {
      reply = '그럼 한식이 좋아, 양식이 좋아? 🍽️';
    } else {
      reply = pick(['ㅋㅋ 좋아! 그래서?', '오케이 ㅎㅎ 계속 얘기해 줘', '좋아좋아! 근데 하나 더 궁금해']);
    }
  } else if (/^(아니|아냐|싫어|ㄴㄴ|별로|노노)[!~.ㅋㅎ\s]*$/.test(text.trim())) {
    reply = /밸런스 게임/.test(prevQuestion) ? '그럼 그냥 수다 떨자 ㅎㅎ 오늘 어땠어?' : '알겠어 ㅎㅎ 그럼 다른 얘기 할까?';
  } else if (/^(ㅋㅋ+|ㅎㅎ+|하하+|크크+)$/.test(text.trim())) {
    reply = pick(['뭐야 왜 웃어 ㅋㅋㅋ', 'ㅋㅋㅋㅋ 나도 웃기네', '그렇게 웃으니까 나도 궁금해지잖아 ㅋㅋ']);
  } else if (/^(ㅠㅠ+|ㅜㅜ+|흑흑+)$/.test(text.trim())) {
    reply = '왜왜 ㅠㅠ 무슨 일 있었어?';
  } else if (/내 이름|내가 누구|내 이름 기억/.test(text) && /\?|뭐|기억/.test(text)) {
    reply = memory.name ? `당연하지! ${memory.name}잖아 😎` : '아직 이름 못 들었어! 뭐라고 부르면 돼?';
  } else if (/내가 좋아하는|내 취향/.test(text)) {
    reply = memory.likes.length ? `기억하지! ${memory.likes.join(', ')} 좋아한다고 했잖아 ㅎㅎ` : '아직 못 들었는데? 좋아하는 거 하나 알려줘!';
  } else if (/(?:내 이름은|나는|난)\s*[가-힣a-zA-Z]{2,12}(?:이야|야|입니다|라고 불러|라고 해)/.test(text)) {
    reply = `${memory.name}구나! 기억해 둘게 🐥 오늘 뭐 하고 있었어?`;
  } else if (/^(왜|왜\?|왜그래|왜 그러는데)/.test(clean)) {
    reply = prevQuestion ? '그냥 네 얘기가 더 궁금해서 ㅎㅎ 부담스러우면 다른 얘기 해도 돼!' : '음, 어떤 부분이 궁금한 거야?';
  } else if (/^(너는|넌)\??$/.test(text.trim())) {
    reply = prevTopic === 'food' ? '난 치킨 얘기만 들어도 신나 ㅋㅋ 너는?' :
            prevTopic === 'play' ? '난 너랑 이렇게 떠드는 게 재밌어 ㅎㅎ' :
            '나는 지금 너랑 얘기하는 게 재밌어 ㅎㅎ';
  } else if (/^(나도|나두|똑같아)[!~.\s]*$/.test(text.trim())) {
    reply = '오 우리 통했네 ㅋㅋ 왜 그렇게 생각해?';
  } else if (/^(뭐|엥|응\?|헐|진짜|대박)[!?~.\s]*$/.test(text.trim())) {
    reply = pick(['ㅋㅋ 왜 그렇게 놀라', '진짜지 ㅎㅎ', '뭐야 무슨 일인데?']);
  } else if (/밸런스\s*게임|둘 중/.test(text)) {
    reply = '좋아! 평생 라면만 먹기 vs 평생 치킨만 먹기, 골라봐 🍗';
  } else {
    const topic = TOPICS.find(t => t.re.test(text));
    if (topic) {
      memory.topic = topic.id;
      const key = Object.keys(DEFAULT_BRAIN).sort((a,b)=>b.length-a.length).find(k => clean.includes(normalize(k)));
      reply = key && Math.random() < .55 ? pick(DEFAULT_BRAIN[key]) :
              `${pick(topic.reactions)} ${pick(topic.questions)}`;
    } else {
      const key = Object.keys(DEFAULT_BRAIN).sort((a,b)=>b.length-a.length).find(k => clean.includes(normalize(k)));
      if (key) reply = pick(DEFAULT_BRAIN[key]);
      else if (/[?？]$/.test(text.trim())) {
        reply = pick(['음, 너는 어떻게 생각해?', '그건 나도 궁금하다 ㅎㅎ 너 생각은 어때?', '어려운 질문인데? 조금만 더 설명해 줄래?']);
      } else if (prevTopic && Math.random() < .65) {
        const topic = TOPICS.find(t => t.id === prevTopic);
        reply = `${pick(['오 그렇구나!', 'ㅋㅋ 재밌네', '그랬어?'])} ${pick(topic.questions)}`;
      } else {
        reply = pick(FALLBACKS);
        if (Math.random() < .28) teachQuestion = text;
      }
    }
  }
  if (reply === oldReply) reply = pick(FALLBACKS);
  memory.lastBotReply = reply;
  memory.lastBotQuestion = reply.includes('?') ? reply : '';
  saveMemory();
  return {reply, teachQuestion};
}

// The site's chat API (FakeNet gateway or the dashboard); local replies remain the fallback.
const SIMSIMI_API = '/simsimi/api';
async function callSimsimiApi(endpoint, payload) {
  try {
    const response = await fetch(`${SIMSIMI_API}/${endpoint}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    });
    return response.ok ? await response.json() : null;
  } catch { return null; }
}

function loadChatHistory() {
  document.getElementById('today-date').textContent = dateText();
  if (!chatHistory.length) {
    renderMessage('bot', '안녕! 난 심심이야 🐥 오늘 뭐 하고 있었어? 편하게 얘기해 줘!');
  } else {
    chatHistory.forEach(msg => renderMessage(msg.sender, msg.text, msg.time, false, msg.teachQuestion || ''));
  }
}

function openTeachModal(question = '') {
  inputTeachQ.value = question;
  inputTeachA.value = '';
  teachModal.classList.add('open');
  (question ? inputTeachA : inputTeachQ).focus();
}
window.openTeachModal = openTeachModal;

chatForm.addEventListener('submit', e => {
  e.preventDefault();
  if (isWaiting) return;
  const text = chatInput.value.trim();
  if (!text) return;
  renderMessage('user', text);
  chatInput.value = '';
  btnSend.disabled = true;
  isWaiting = true;
  setTimeout(() => renderMessage('bot', 'TYPING', '', false), 160);
  const delay = 450 + Math.min(850, text.length * 23);
  const remote = callSimsimiApi('chat', {text});
  setTimeout(async () => {
    const local = getBotResponse(text);
    const answer = await remote;
    const reply = answer && typeof answer.reply === 'string' && answer.reply ? answer.reply : local.reply;
    if (reply !== local.reply) { memory.lastBotReply = reply; memory.lastBotQuestion = reply.includes('?') ? reply : ''; saveMemory(); }
    document.getElementById('typing-node')?.remove();
    renderMessage('bot', reply, timeText(), true, local.teachQuestion);
    isWaiting = false;
    btnSend.disabled = !chatInput.value.trim();
    chatInput.focus();
  }, delay);
});
chatInput.addEventListener('input', () => btnSend.disabled = !chatInput.value.trim());

document.getElementById('btn-teach').addEventListener('click', () => openTeachModal());
document.getElementById('btn-cancel-teach').addEventListener('click', () => teachModal.classList.remove('open'));
teachModal.addEventListener('click', e => { if (e.target === teachModal) teachModal.classList.remove('open'); });
document.getElementById('btn-submit-teach').addEventListener('click', () => {
  const q = inputTeachQ.value.trim(), a = inputTeachA.value.trim();
  if (!q || !a) { showToast('질문과 대답을 모두 입력해 줘!'); return; }
  if (!Array.isArray(learnedBrain[q])) learnedBrain[q] = [];
  learnedBrain[q].push(a);
  storage.set('simsimi_brain', learnedBrain);
  callSimsimiApi('teach', {question: q, answer: a});
  teachModal.classList.remove('open');
  showToast('새로운 대답을 배웠어! 🐥');
});
function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}
document.getElementById('btn-theme').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  document.getElementById('btn-theme').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
});
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('대화 기록을 모두 지울까?\n(가르친 대답은 유지돼)')) return;
  chatHistory = [];
  memory = {name:'', likes:[], topic:'', lastBotQuestion:'', lastBotReply:'', turns:0};
  storage.remove('simsimi_history');
  storage.remove('simsimi_context');
  chatArea.innerHTML = '<div class="date-notice"><span id="today-date"></span></div>';
  loadChatHistory();
});
loadChatHistory();
</script>
