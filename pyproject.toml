[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-v"
version = "0.1.0"
description = "Agent security research: aligned Transformer representation extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.8,<2.9", "numpy>=1.26,<3", "packaging>=23"]

[project.optional-dependencies]
hf = ["transformers==4.57.6"]
dev = ["pytest>=8,<9", "ruff==0.15.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
